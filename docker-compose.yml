# Runs the app on http://localhost:3000 with its database on a named volume.
#
#   cp .env.example .env    # then set JWT_SECRET
#   docker compose up --build
services:
  kanban:
    build: .
    image: kanban-v2
    ports:
      - "${PORT:-3000}:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      # Set to true when the app is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - kanban-data:/data
    restart: unless-stopped

volumes:
  kanban-data:
